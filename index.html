<!DOCTYPE html>
<html lang=\"en\">
<head>
  <meta charset=\"UTF-8\" />
  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />
  <title>Trump Letter to Biden - Concept 4</title>
  <link rel=\"stylesheet\" href=\"styles.css\" />
  <script defer src=\"script.js\"></script>
</head>
<body>
  <header class=\"site-header\"><h1>Letter Tabs</h1></header>
  <nav class=\"tabs\" aria-label=\"Sections\">
    <button data-tab=\"a\" class=\"tab active\">Editor</button>
    <button data-tab=\"b\" class=\"tab\">Preview</button>
  </nav>
  <main class=\"container\">
    <section id=\"tab-a\" class=\"panel\">
      <h2>Editor</h2>
      <textarea id=\"tA\" placeholder=\"Write here...\"></textarea>
      <button id=\"go\">Show</button>
    </section>
    <section id=\"tab-b\" class=\"panel" aria-label=\"Preview area\" style=\"display:none;\">
      <h2>Preview</h2>
      <div id=\"pv\" class=\"preview-box\"></div>
    </section>
  </main>
</body>
</html>
